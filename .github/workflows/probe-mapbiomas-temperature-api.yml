name: Probe API temperatura MapBiomas

on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/scripts/probe_mapbiomas_temperature_api.py'
      - 'tea-brasil/scripts/probe_mapbiomas_statistics_api.py'
      - 'tea-brasil/scripts/probe_mapbiomas_ranking_api.py'
      - 'tea-brasil/scripts/probe_mapbiomas_download_api.py'
      - 'tea-brasil/scripts/compare_mapbiomas_2025_ibge2022.py'
      - '.github/workflows/probe-mapbiomas-temperature-api.yml'

concurrency:
  group: probe-mapbiomas-temperature
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar API pública de temperatura MapBiomas
        run: python tea-brasil/scripts/probe_mapbiomas_temperature_api.py
      - name: Testar ranking municipal 2022 em PRD e DEV
        run: python tea-brasil/scripts/probe_mapbiomas_ranking_api.py
      - name: Localizar consulta de tarefas assíncronas
        run: python tea-brasil/scripts/probe_mapbiomas_statistics_api.py
      - name: Localizar rotas públicas de download e exportação
        run: python tea-brasil/scripts/probe_mapbiomas_download_api.py
      - name: Instalar leitor DBF/SHP leve
        run: python -m pip install --disable-pip-version-check --quiet pyshp
      - name: Comparar malha municipal atual com universo Censo 2022
        continue-on-error: true
        run: python tea-brasil/scripts/compare_mapbiomas_2025_ibge2022.py
