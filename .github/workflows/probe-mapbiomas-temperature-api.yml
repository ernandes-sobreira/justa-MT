name: Probe API temperatura MapBiomas

on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/scripts/probe_mapbiomas_temperature_api.py'
      - 'tea-brasil/scripts/probe_mapbiomas_statistics_api.py'
      - '.github/workflows/probe-mapbiomas-temperature-api.yml'

concurrency:
  group: probe-mapbiomas-temperature
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar API pública de temperatura MapBiomas
        run: python tea-brasil/scripts/probe_mapbiomas_temperature_api.py
      - name: Descobrir rotas estatísticas usadas pela plataforma
        run: python tea-brasil/scripts/probe_mapbiomas_statistics_api.py
