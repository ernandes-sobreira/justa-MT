name: Probe rotas territoriais MapBiomas

on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/scripts/probe_mapbiomas_territory_routes.py'
      - '.github/workflows/probe-mapbiomas-territory-routes.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tea-brasil/scripts/probe_mapbiomas_territory_routes.py
