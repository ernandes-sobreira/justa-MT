name: Atualizar temperatura MapBiomas TEA-Brasil

on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/scripts/build_mapbiomas_temperature_2022.py'
      - '.github/workflows/update-mapbiomas-temperature.yml'

permissions:
  contents: write

jobs:
  build-temperature:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias geoespaciais
        run: python -m pip install --quiet pandas geopandas rasterio exactextract pyogrio
      - name: Gerar temperatura municipal 2022
        run: python tea-brasil/scripts/build_mapbiomas_temperature_2022.py
      - name: Validar 5.570 municipios e metadados
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('tea-brasil/data/mapbiomas_temperatura_2022.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          codes={r['codigo_ibge'] for r in rows}
          assert len(rows)==5570, len(rows)
          assert len(codes)==5570, len(codes)
          fields=[
              'temperatura_media_ar_c_2022',
              'temperatura_maxima_ar_c_2022',
              'temperatura_minima_ar_c_2022',
          ]
          meta=json.loads(Path('tea-brasil/data/metadata_mapbiomas_temperatura_2022.json').read_text(encoding='utf-8'))
          assert meta['municipalities_in_file']==5570
          assert meta['unique_codes']==5570
          for f in fields:
              valid=sum(r[f] != '' for r in rows)
              assert valid == meta['coverage']['valid_counts'][f]
              assert 5570-valid == meta['coverage']['na_counts'][f]
              assert valid > 0
          print('VALIDADO: 5.570 códigos; média, máxima e mínima com NA preservado e documentado.')
          PY
      - name: Publicar base de temperatura
        run: |
          git config user.name 'tea-brasil-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tea-brasil/data/mapbiomas_temperatura_2022.csv tea-brasil/data/mapbiomas_temperatura_2022.json tea-brasil/data/metadata_mapbiomas_temperatura_2022.json
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
          else
            git commit -m 'Integra temperatura MapBiomas 2022 aos 5570 municípios'
            git push
          fi
