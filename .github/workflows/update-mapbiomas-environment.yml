name: Atualizar ambiente MapBiomas TEA-Brasil

on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/scripts/build_mapbiomas_environment.py'
      - '.github/workflows/update-mapbiomas-environment.yml'

permissions:
  contents: write

jobs:
  build-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar leitor XLSX
        run: python -m pip install --quiet openpyxl
      - name: Gerar indicadores MapBiomas 2022
        run: python tea-brasil/scripts/build_mapbiomas_environment.py
      - name: Validar 5.570 municípios
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('tea-brasil/data/mapbiomas_ambiente_2022.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          codes={r['codigo_ibge'] for r in rows}
          assert len(rows)==5570, len(rows)
          assert len(codes)==5570, len(codes)

          intentional_na={'2605459','5106240','5107925'}
          observed_na={r['codigo_ibge'] for r in rows if not r['vegetacao_natural_pct_2022'] or not r['area_urbanizada_pct_2022']}
          assert observed_na==intentional_na, (observed_na,intentional_na)
          assert all(r['status_ambiente_2022']=='ok' for r in rows if r['codigo_ibge'] not in intentional_na)
          assert all(r['nota_ambiente_2022'] for r in rows if r['codigo_ibge'] in intentional_na)

          meta=json.loads(Path('tea-brasil/data/metadata_mapbiomas_ambiente_2022.json').read_text())
          assert meta['municipalities_in_file']==5570
          assert meta['unique_codes']==5570
          assert meta['reference_year']==2022
          assert meta['valid_environment_municipalities']==5567
          assert meta['missing_vegetation_cells']==3
          assert meta['missing_urban_cells']==3
          assert set(meta['intentional_na_codes'])==intentional_na
          print('VALIDADO: 5.570 códigos Censo 2022; 5.567 indicadores MapBiomas válidos; 3 NA territoriais/fonte documentados')
          PY
      - name: Publicar base ambiental
        run: |
          git config user.name 'tea-brasil-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tea-brasil/data/mapbiomas_ambiente_2022.csv tea-brasil/data/mapbiomas_ambiente_2022.json tea-brasil/data/metadata_mapbiomas_ambiente_2022.json
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
          else
            git commit -m 'Atualiza ambiente MapBiomas 2022 dos 5570 municípios'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
