name: Probe exportador MapBiomas

on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/scripts/probe_mapbiomas_download_api.py'
      - 'tea-brasil/scripts/probe_mapbiomas_export_real.py'
      - '.github/workflows/probe-mapbiomas-export.yml'

permissions:
  contents: read

jobs:
  probe-export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Testar exportacao real de temperatura media 2022
        run: python tea-brasil/scripts/probe_mapbiomas_export_real.py
