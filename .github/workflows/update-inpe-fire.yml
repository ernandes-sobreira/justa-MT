name: Atualizar fogo INPE TEA-Brasil

on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/scripts/build_inpe_fire.py'
      - '.github/workflows/update-inpe-fire.yml'

permissions:
  contents: write

jobs:
  build-fire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Dependência XLS IBGE
        run: python -m pip install --quiet xlrd
      - name: Gerar indicadores municipais de fogo
        run: python tea-brasil/scripts/build_inpe_fire.py
      - name: Validar 5.570 municípios
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('tea-brasil/data/inpe_fogo_2022.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          codes={r['codigo_ibge'] for r in rows}
          assert len(rows)==5570, len(rows)
          assert len(codes)==5570, len(codes)
          assert all(r['focos_inpe_ref_2022']!='' for r in rows)
          assert all(r['area_territorial_km2_2022']!='' for r in rows)
          assert all(r['focos_por_100_km2_2022']!='' for r in rows)
          meta=json.loads(Path('tea-brasil/data/metadata_inpe_fogo_2022.json').read_text(encoding='utf-8'))
          assert meta['municipalities_in_file']==5570
          assert meta['unique_codes']==5570
          assert meta['missing_fire_cells_2022']==0
          assert meta['valid_density_cells_2022']==5570
          assert meta['total_reference_hotspots_2022']>0
          print('VALIDADO: 5.570 códigos; focos, área e densidade sem células ausentes.')
          PY
      - name: Publicar base de fogo
        run: |
          git config user.name 'tea-brasil-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tea-brasil/data/inpe_fogo_2022.csv tea-brasil/data/inpe_fogo_2022.json tea-brasil/data/metadata_inpe_fogo_2022.json
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
          else
            git commit -m 'Integra focos INPE 2022 aos 5570 municípios'
            git push
          fi
