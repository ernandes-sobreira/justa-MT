name: Build temperatura municipal MapBiomas 2022

# Execução validada para estatística zonal municipal IBGE 2022.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/scripts/build_mapbiomas_temperatura_2022.py'
      - '.github/workflows/build-mapbiomas-temperatura.yml'

concurrency:
  group: build-mapbiomas-temperatura-2022
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias geoespaciais
        run: python -m pip install --disable-pip-version-check --quiet geopandas rasterio

      - name: Gerar e validar temperatura municipal 2022
        run: python tea-brasil/scripts/build_mapbiomas_temperatura_2022.py

      - name: Validacao independente dos arquivos finais
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          base = Path('tea-brasil/data')
          csvp = base / 'temperatura_2022.csv'
          jsonp = base / 'temperatura_2022.json'
          metap = base / 'metadata_temperatura_2022.json'
          with csvp.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          codes = [r['codigo_ibge'] for r in rows]
          assert len(rows) == 5570, len(rows)
          assert len(set(codes)) == 5570, len(set(codes))
          assert all(len(c) == 7 and c.isdigit() for c in codes)
          required = ('temp_media_anual_c_2022','temp_max_anual_c_2022','temp_min_anual_c_2022')
          assert all(k in rows[0] for k in required)
          data = json.loads(jsonp.read_text(encoding='utf-8'))
          meta = json.loads(metap.read_text(encoding='utf-8'))
          assert len(data) == 5570
          assert meta['universo']['linhas'] == 5570
          assert meta['universo']['codigos_unicos'] == 5570
          assert meta['status'] == 'validado_para_integracao', meta['status']
          for field in required:
              assert meta['cobertura'][field]['validos'] >= 5550, (field, meta['cobertura'][field])
          for r in rows:
              vals = [float(r[k]) for k in required if r.get(k)]
              assert all(-30 <= v <= 60 and math.isfinite(v) for v in vals)
              if all(r.get(k) for k in required):
                  assert float(r['temp_min_anual_c_2022']) <= float(r['temp_media_anual_c_2022']) <= float(r['temp_max_anual_c_2022'])
          print('VALIDACAO_INDEPENDENTE_OK', len(rows), len(set(codes)))
          PY

      - name: Publicar somente dados validados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tea-brasil/data/temperatura_2022.csv \
                  tea-brasil/data/temperatura_2022.json \
                  tea-brasil/data/metadata_temperatura_2022.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes nos arquivos de temperatura."
            exit 0
          fi
          git commit -m "Integra temperatura municipal MapBiomas 2022 validada"
          git pull --rebase origin main
          git push origin HEAD:main
