name: Testar profissionais CNES

on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/scripts/probe_cnes_profissionais.py'
      - 'tea-brasil/scripts/probe_cnes_state.py'
      - '.github/workflows/probe-cnes-profissionais.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar endpoints oficiais CNES
        run: python tea-brasil/scripts/probe_cnes_state.py
