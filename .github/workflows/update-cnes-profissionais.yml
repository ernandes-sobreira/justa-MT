name: Atualizar profissionais CNES TEA-Brasil

on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/scripts/build_cnes_profissionais.py'
      - '.github/workflows/update-cnes-profissionais.yml'
  schedule:
    - cron: '41 10 3 * *'

permissions:
  contents: write

jobs:
  build-profissionais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar profissionais por município
        run: python tea-brasil/scripts/build_cnes_profissionais.py
      - name: Validar 5.570 municípios
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('tea-brasil/data/cnes_profissionais_tea_2022.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          codes={r['codigo_ibge'] for r in rows}
          assert len(rows)==5570, len(rows)
          assert len(codes)==5570, len(codes)
          meta=json.loads(Path('tea-brasil/data/metadata_cnes_profissionais_2022.json').read_text())
          assert meta['state_files_downloaded']==27
          assert meta['municipalities_in_file']==5570
          assert meta['unique_codes']==5570
          for k,v in meta['total_unique_professionals_by_occupation'].items():
              assert v>0, (k,v)
          print('VALIDADO: 5.570 municípios; 27 UFs; quatro CBOs com dados.')
          PY
      - name: Publicar base de profissionais
        run: |
          git config user.name 'tea-brasil-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tea-brasil/data/cnes_profissionais_tea_2022.csv tea-brasil/data/cnes_profissionais_tea_2022.json tea-brasil/data/metadata_cnes_profissionais_2022.json
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
          else
            git commit -m 'Atualiza profissionais CNES 2022 dos 5570 municípios'
            git push
          fi
