name: Ajustar saida ERA5-Land

on:
  push:
    paths:
      - 'tea-brasil/scripts/patch_era5_temperature_output.py'
      - '.github/workflows/patch-era5-temperature-output.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch seguro ao gerador
        run: python tea-brasil/scripts/patch_era5_temperature_output.py
      - name: Validar sintaxe Python
        run: python -m py_compile tea-brasil/scripts/build_era5land_temperatura_2022.py
      - name: Publicar gerador final
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tea-brasil/scripts/build_era5land_temperatura_2022.py
          if git diff --cached --quiet; then
            echo 'Sem alteracoes para publicar.'
          else
            git commit -m 'Robustece JSON e inclui TEA na temperatura ERA5-Land'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
