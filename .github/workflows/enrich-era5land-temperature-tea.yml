name: Enriquecer temperatura com TEA (fallback manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --quiet pandas
      - name: Juntar percentual TEA por codigo IBGE
        run: python tea-brasil/scripts/enrich_era5land_temperatura_with_tea.py
      - name: Validar e publicar
        run: |
          python - <<'PY'
          import pandas as pd
          p='tea-brasil/data/era5land_temperatura_2022.csv'
          d=pd.read_csv(p,dtype={'codigo_ibge':'string'},encoding='utf-8-sig',na_values=['NA'])
          assert len(d)==5570 and d.codigo_ibge.nunique()==5570
          assert 'percentual_tea_2022' in d.columns
          print('JOIN_VALIDADO',len(d),d.codigo_ibge.nunique(),d.percentual_tea_2022.notna().sum())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tea-brasil/data/era5land_temperatura_2022.csv tea-brasil/data/era5land_temperatura_2022.json tea-brasil/data/metadata_era5land_temperatura_2022.json
          if git diff --cached --quiet; then
            echo 'Sem alteracoes para publicar.'
          else
            git commit -m 'Junta percentual TEA a temperatura ERA5-Land 2022'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
