name: Check módulo temperatura TEA-Brasil

on:
  workflow_dispatch:
  push:
    paths:
      - 'tea-brasil/temperature-v1.js'
      - '.github/workflows/check-temperature-module.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe JavaScript
        run: node --check tea-brasil/temperature-v1.js
